name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/tinder-film-series-app-0mwku5
  # Rebuild the catalog from TMDB once a week so new releases show up.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      refresh_catalog:
        description: 'Rebuild static/catalog.json from TMDB before deploying'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# Never run two deploys at once, but always let the newest push win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      # The catalog is committed, so ordinary pushes deploy in seconds. It is only
      # rebuilt on the weekly schedule or when a manual run asks for it. The TMDB
      # credentials are build-time only: what ships is the resulting JSON.
      - name: Rebuild catalog from TMDB
        id: catalog
        # A healthy run takes about four minutes; the script has its own deadline
        # and this is the backstop if it ever wedges outright.
        timeout-minutes: 25
        if: >-
          (github.event_name == 'schedule' || inputs.refresh_catalog) &&
          (env.TMDB_READ_ACCESS_TOKEN != '' || env.TMDB_API_KEY != '')
        run: npm run catalog

      - name: Commit the refreshed catalog
        if: steps.catalog.outcome == 'success' && github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- static/catalog.json; then
            echo "Catalog unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/catalog.json
          git commit -m "Refresh catalog from TMDB"
          git push origin HEAD:${{ github.ref_name }}

      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      # enablement only works where the job token may change repository settings.
      # GITHUB_TOKEN cannot be granted `administration: write`, so on this repo
      # Pages had to be switched on by hand once; this now just reads it back.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
