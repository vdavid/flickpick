name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/tinder-film-series-app-0mwku5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but always let the newest push win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      # Posters are baked into the catalog at build time, so the API key never
      # reaches the browser. Skipped when the secret isn't set; the app then
      # falls back to its generated cover art.
      - name: Bake OMDb posters into the catalog
        if: env.OMDB_API_KEY != ''
        run: npm run enrich

      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
